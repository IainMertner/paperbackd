  <style>
    /* Inked edge on the book modals, matching the popover on home.
       Scoped to modal cards: the same treatment on the grid behind them would
       put a rough edge on every tile at once. */
    .book-modal-inner .card {
      position: relative;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .book-modal-inner .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      filter: url(#ink-edge);
      z-index: -1;
    }

    /* Same treatment on the add-book card. Unlike the modal cards this one is
       in normal page flow, so it needs isolation: without a stacking context
       of its own the z-index:-1 layer falls behind the page background and
       disappears.

       That isolation then traps the search suggestions inside the card, and
       the books grid below — later in the DOM — would paint over them. z-index
       lifts the card clear of the grid while staying under the filter dropdown
       above it, which is 100 and hangs down across this card. */
    .add-book-card {
      position: relative;
      isolation: isolate;
      z-index: 20;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .add-book-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      filter: url(#ink-edge);
      z-index: -1;
    }
  </style>
</head>

  <script>document.body.classList.add('auth-loading');</script>
  <script type="module">
    import { requireAuth } from '../js/auth.js';
    import { getBooks, addBook, getCountryRemaps, resolveBookLanguage, addFinishedBook, updateBookProgress, finishBook, deleteBook, dnfBook, undnfBook, unfinishBook, updateBookRating, updateBookDates, clearBookDate, updateBookCover, updateShelf, getProfileByUsername, updateBookMeta, updateBookReads, getLists, addBookToList, removeBookFromList, syncBookActivity, getAuthorCountryOverrides, getFollowing, setBookPrivate } from '../js/firebase.js';
    import { deleteField } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
    import { normalizeCountry, serialiseCalls } from '../js/utils.js';
    import { fitDropdown, releaseDropdown, autoFit } from '../js/dropdown.js';
    import { metaForSlug, searchBooks } from '../js/hardcover.js';
    import { parseReleaseYear, pickIsbn13, primaryAuthor, progressBarPercent, wantToReadBlock, BOOK_LANGUAGES as LANGUAGES } from '../js/book-utils.js';
    import { fetchBookMeta } from '../js/enrich.js';

    const HARDCOVER_PROXY = 'https://frosty-paper-e53b.phixel66.workers.dev/';

    let viewMode = localStorage.getItem('library-view') || 'grid';

    // Full-page navigation (this is a static multi-page app, not an SPA) aborts any
    // in-flight Firestore write — including edits still sitting in a debounce timer
    // that hasn't fired yet. Warn before leaving if anything hasn't finished saving.
    let pendingSaves = 0;
    function markDirty()  { pendingSaves++; }
    function markClean()  { pendingSaves = Math.max(0, pendingSaves - 1); }
    window.addEventListener('beforeunload', e => {
      if (pendingSaves > 0) { e.preventDefault(); e.returnValue = ''; }
    });

    function bookMissingFlags(book) {
      const flags = [];
      if (!book.coverUrl)              flags.push('no-cover');
      if (!book.country)               flags.push('no-country');
      if (!book.authorGender)          flags.push('no-gender');
      if (!book.genres?.length)        flags.push('no-genre');
      if (book.releaseYear == null)    flags.push('no-year');
      if (!book.totalPages)            flags.push('no-pages');
      if (!book.language)              flags.push('no-language');
      if (!book.format)                flags.push('no-format');
      return flags;
    }

    function makeBookListRow(book) {
      const el = document.createElement('div');
      el.className = 'books-list-row';
      el.dataset.title    = (book.title    || '').toLowerCase();
      el.dataset.author   = (book.author   || '').toLowerCase();
      el.dataset.language = (book.language || '').toLowerCase();
      el.dataset.format   = (book.format   || '').toLowerCase();
      el.dataset.country  = (book.country      || '').toLowerCase();
      el.dataset.gender   = (book.authorGender || '').toLowerCase();
      el.dataset.genre    = (book.genres || []).map(g => g.toLowerCase()).join(',');
      el.dataset.rating   = book.rating != null ? String(book.rating) : '';
      el.dataset.lists    = book._listIds || '';
      el.dataset.gbid     = book.gbid || '';
      el.dataset.flags    = bookMissingFlags(book).join(',');
      const author = book.author ? `<span style="color:var(--text-muted);font-weight:400"> · ${esc(book.author)}</span>` : '';
      let rightHtml = '';
      const listRating = getDisplayRating(book);
      if (listRating) {
        let s = '';
        for (let i = 1; i <= 5; i++) {
          if (listRating >= i)          s += '<span class="star-char full">★</span>';
          else if (listRating >= i-0.5) s += '<span class="star-char half">★</span>';
          else                          s += '<span class="star-char">★</span>';
        }
        rightHtml = `<span style="flex-shrink:0;margin-left:.5rem;display:inline-flex;gap:.05rem;line-height:1">${s}</span>`;
      } else if (book.status === 'reading' && progressBarPercent(book) != null) {
        const pct = progressBarPercent(book);
        rightHtml = `<span style="flex-shrink:0;margin-left:.5rem;font-size:.75rem;color:var(--text-muted)">${pct}%</span>`;
      }
      // lazy: a large library renders every row up front, and these are the
      // only images in list view.
      const coverHtml = book.coverUrl
        ? `<img class="books-list-cover" src="${esc(book.coverUrl)}" alt="" loading="lazy">`
        : `<div class="books-list-cover books-list-cover-empty"></div>`;
      el.innerHTML = `${coverHtml}<div style="flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:.875rem;font-weight:600">${esc(book.title)}${author}</div>${rightHtml}`;
      return el;
    }

    async function hcPost(query, variables) {
      const r = await fetch(HARDCOVER_PROXY, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables })
      });
      if (!r.ok) throw new Error(`Proxy error ${r.status}`);
      return r.json();
    }

    function cleanTitle(t)  { return (t || '').replace(/\s*\([^)]*#\s*\d+[^)]*\)/g, '').trim(); }
    function cleanAuthor(a) { return (a || '').replace(/^([^,]+),\s*(.+)$/, '$2 $1').trim(); }

    async function searchHardcover(q) {
      // searchBooks applies admin remaps, so a redirected record is never the
      // one a newly added book gets matched to.
      const [doc] = await searchBooks(q, 3);
      return doc?.slug ? doc : null;
    }

    // Loaded once; used by repairBook and the background country fetch on book-add
    let _authorOverridesCache = null;
    async function getOverrides() {
      if (!_authorOverridesCache) _authorOverridesCache = await getAuthorCountryOverrides();
      return _authorOverridesCache;
    }

    async function repairBook(book) {
      const updates = {};

      // Phase 1: match unmatched book via Hardcover title search
      if (!book.gbid && !book.coverUrl?.startsWith('data:')) {
        try {
          const title  = cleanTitle(book.title);
          const author = cleanAuthor(book.author || '');
          let doc = await searchHardcover(`${title} ${author}`.trim());
          if (!doc && author) doc = await searchHardcover(title);
          if (doc?.slug) {
            if (!book.gbid)      updates.gbid        = doc.slug;
            if (!book.coverUrl)  updates.coverUrl    = doc.image?.url || '';
            if (!book.totalPages && doc.pages) updates.totalPages = doc.pages;
            if (book.releaseYear == null && doc.release_year) updates.releaseYear = doc.release_year;
          }
        } catch (e) { console.warn('Repair: title search failed', e); }
      }

      // Phase 2: fill gaps for already-matched book via slug query
      const gbid = updates.gbid || book.gbid;

      if (gbid && !/^\d+$/.test(gbid) && (book.releaseYear == null || !book.totalPages || !book.author || !book.genres?.length || !book.isbn13)) {
        try {
          const data = await hcPost(
            `query($slug:String!){books(where:{slug:{_eq:$slug}},limit:1){slug pages release_year contributions{contribution author{name}} cached_tags en:editions(where:{_and:[{isbn_13:{_is_null:false}},{language:{code2:{_eq:"en"}}}]},limit:3){isbn_13} any:editions(where:{isbn_13:{_is_null:false}},limit:3){isbn_13}}}`,
            { slug: gbid }
          );

          const hc = data?.data?.books?.[0];
          if (hc) {
            if (book.releaseYear == null && hc.release_year) updates.releaseYear = hc.release_year;
            if (!book.totalPages  && hc.pages)               updates.totalPages  = hc.pages;
            // Backfills the back catalogue through a path that already exists,
            // rather than needing a migration for every book added before this.
            if (!book.isbn13) {
              const isbn13 = pickIsbn13(hc.en, hc.any);
              if (isbn13) updates.isbn13 = isbn13;
            }
            if (!book.author) {
              const name = primaryAuthor(hc.contributions);
              if (name) updates.author = name;
            }
            if (!book.genres?.length) {
              const genres = (hc.cached_tags?.Genre || []).map(t => t.tag).filter(Boolean);
              if (genres.length) updates.genres = genres;
            }
          }
        } catch (e) { console.warn('Repair: slug query failed', e); }
      } else {

      }

      // Phase 2b: genre fetch for numeric Hardcover IDs
      if (gbid && /^\d+$/.test(gbid) && !book.genres?.length) {
        try {
          const data = await hcPost(
            `query($id:Int!){books(where:{id:{_eq:$id}},limit:1){cached_tags}}`,
            { id: parseInt(gbid, 10) }
          );

          const genres = (data?.data?.books?.[0]?.cached_tags?.Genre || []).map(t => t.tag).filter(Boolean);
          if (genres.length) updates.genres = genres;
        } catch (e) { console.warn('Repair: numeric genre query failed', e); }
      }

      // Phase 2.5: re-normalize stored country
      const cRemaps = await getCountryRemaps();
      const storedCountry = book.country;
      if (storedCountry && normalizeCountry(storedCountry, cRemaps) !== storedCountry) {
        updates.country = normalizeCountry(storedCountry, cRemaps);
      }

      // Phase 3: country + gender lookup — overrides first, then Wikidata
      const authorForCountry = updates.author || book.author;
      const needCountry = !book.country && !updates.country;
      const needGender  = !book.authorGender && !updates.authorGender;
      if (authorForCountry && (needCountry || needGender)) {
        if (needCountry) {
          const overrides = await getOverrides();
          const overrideKey = authorForCountry.toLowerCase().trim();
          if (overrides[overrideKey]) updates.country = overrides[overrideKey];
        }
        if (needCountry && !updates.country || needGender) {
          try {
            const base = 'https://www.wikidata.org/w/api.php';
            const sr = await fetch(`${base}?action=wbsearchentities&search=${encodeURIComponent(authorForCountry)}&language=en&type=item&format=json&origin=*&limit=1`);
            if (sr.ok) {
              const sd = await sr.json();
              const qid = sd.search?.[0]?.id;
              if (qid) {
                const er = await fetch(`${base}?action=wbgetentities&ids=${qid}&props=claims&format=json&origin=*`);
                if (er.ok) {
                  const ed = await er.json();
                  const claims = ed.entities?.[qid]?.claims || {};

                  if (needCountry && !updates.country) {
                    const p27 = claims.P27 || [];
                    const bestP27 = p27.find(c => c.rank === 'preferred') || p27.find(c => c.rank === 'normal') || p27[0];
                    const countryQid = bestP27?.mainsnak?.datavalue?.value?.id;
                    if (countryQid) {
                      const lr = await fetch(`${base}?action=wbgetentities&ids=${countryQid}&props=labels&languages=en&format=json&origin=*`);
                      if (lr.ok) {
                        const ld = await lr.json();
                        const countryName = ld.entities?.[countryQid]?.labels?.en?.value;
                        if (countryName) updates.country = normalizeCountry(countryName, await getCountryRemaps());
                      }
                    }
                  }

                  if (needGender) {
                    const GENDER_MAP = {
                      Q6581072: 'Female', Q6581097: 'Male', Q1097630: 'Intersex',
                      Q48270: 'Non-binary', Q2449503: 'Transgender female', Q1052281: 'Transgender male',
                    };
                    const p21 = claims.P21 || [];
                    const bestP21 = p21.find(c => c.rank === 'preferred') || p21.find(c => c.rank === 'normal') || p21[0];
                    const genderQid = bestP21?.mainsnak?.datavalue?.value?.id;
                    if (genderQid && GENDER_MAP[genderQid]) updates.authorGender = GENDER_MAP[genderQid];
                  }
                }
              }
            }
          } catch (e) { /* silently ignore */ }
        }
      }

      return updates;
    }

      if (!rating) return '';
      let html = '<span class="stars-display">';
      for (let i = 1; i <= 5; i++) {
        if (rating >= i)          html += '<span class="star-char full">★</span>';
        else if (rating >= i-0.5) html += '<span class="star-char half">★</span>';

    function createStarPicker(initial) {
      const wrap = document.createElement('div');
      wrap.className = 'star-picker';
      let value = initial || 0;
      const btns = [];

      for (let i = 1; i <= 5; i++) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'star-pick-btn';
        btn.textContent = '★';
        btn.dataset.i = i;
        btns.push(btn);
        wrap.appendChild(btn);
      }

      function update(v) {
        value = v;
        btns.forEach((b, idx) => {
          const n = idx + 1;
          b.classList.remove('full', 'half');
          if (value >= n)          b.classList.add('full');
          else if (value >= n-0.5) b.classList.add('half');
        });
      }

      wrap.addEventListener('click', e => {
        const btn = e.target.closest('.star-pick-btn');
        if (!btn) return;
        const i    = parseInt(btn.dataset.i);
        const half = e.offsetX < btn.offsetWidth / 2;
        const v    = half ? i - 0.5 : i;
        update(v === value ? 0 : v);
      });

      wrap.getValue = () => value || null;
      wrap.setValue = v => update(v || 0);
      update(value);
      return wrap;
    }

    async function openCoverPicker(book, wrapEl, coverCell) {
      const overlay = document.createElement('div');
      overlay.className = 'cover-picker-overlay';
      const modal = document.createElement('div');
      modal.className = 'cover-picker-modal';
      modal.innerHTML = `<div style="font-weight:600;margin-bottom:.2rem">${esc(book.title)}</div>
        <div style="font-size:.82rem;color:var(--text-muted);margin-bottom:.875rem">Choose an edition cover</div>
        <div class="cover-picker-grid" id="cpg"><span style="font-size:.85rem;color:var(--text-muted)">Loading…</span></div>`;
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
      overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

      const grid = modal.querySelector('#cpg');

      function bestCoverUrl(url) {
        if (!url) return url;
        // OpenLibrary: upgrade S or M thumbnails to L
        url = url.replace(/-(S|M)\.jpg(\?|$)/, '-L.jpg$2');
        return url;
      }

      try {
        let editions = [];

        // Kick off Google Books fetch in parallel with Hardcover
        const gbQuery = encodeURIComponent(`${book.title}${book.author ? ' ' + book.author : ''}`);
        const GB_KEY = 'AIzaSyCHP8T9d3zm7IDhmRchE_wk2-9vR4xs_3I';
        const gbFetch = fetch(`https://www.googleapis.com/books/v1/volumes?q=${gbQuery}&maxResults=20&printType=books&key=${GB_KEY}`)
          .then(r => r.json()).catch(() => null);

        // search by title to get multiple book IDs (catches different publisher entries)
        const searchData = await hcPost(
          `query($q:String!){search(query:$q,query_type:"Book",per_page:8){results}}`,
          { q: book.title }
        );
        const hits = searchData?.data?.search?.results?.hits || [];
        const bookIds = [...new Set(hits.map(h => h.document?.id).filter(Boolean).map(id => parseInt(id, 10)).filter(n => !isNaN(n)))];

        // If the stored gbid is a slug (not numeric), resolve it to an ID too
        const slug = /^\d+$/.test(book.gbid) ? '' : (book.gbid || '');
        if (slug) {
          const d = await hcPost(
            `query($s:String!){books(where:{slug:{_eq:$s}},limit:1){id}}`,
            { s: slug }
          );
          const id = d?.data?.books?.[0]?.id;
          if (id && !bookIds.includes(id)) bookIds.push(id);
        }

        if (bookIds.length) {
          const d = await hcPost(
            `query($ids:[Int!]!){editions(where:{book_id:{_in:$ids}},limit:100){id image{url width height} publisher{name} release_year}}`,
            { ids: bookIds }
          );
          const seen = new Set();
          editions = (d?.data?.editions || []).filter(e => {
            if (!e.image?.url) return false;
            // Filter out low-res covers (width known and too small for a shelf)
            if (e.image.width && e.image.width < 180) return false;
            const url = bestCoverUrl(e.image.url);
            if (seen.has(url)) return false;
            seen.add(url);
            e.image.url = url;
            return true;
          });
        }

        grid.innerHTML = '';

        const currentUrl = book.coverUrl || null;
        const filteredEditions = editions.filter(e => e.image.url !== currentUrl);

        async function pickCover(url) {
          if (url === book.coverUrl) { overlay.remove(); return; }
          book.coverUrl = url;
          wrapEl.innerHTML = coverInnerHtml(book);
          const newCoverImg = wrapEl.querySelector('.book-cover, .book-cover-img');
          if (newCoverImg) { newCoverImg.style.width = '72px'; newCoverImg.style.height = '108px'; }
          if (coverCell && !coverCell.classList.contains('books-list-row')) {
            const existImg = coverCell.querySelector('img:not(.book-cover-img)');
            const existPh  = coverCell.querySelector('.library-cover-placeholder');
            if (existImg) { existImg.src = url; }
            else {
              const img = document.createElement('img');
              img.src = url; img.alt = '';
              existPh ? existPh.replaceWith(img) : coverCell.prepend(img);
            }
          }
          overlay.remove();
          updateBookCover(user.uid, book.id, url, { gbid: book.gbid, title: book.title });
          if (profile.shelf?.some(s => s.gbid === book.gbid && book.gbid)) {
            const updatedShelf = profile.shelf.map(s =>
              s.gbid === book.gbid ? { ...s, coverUrl: url } : s
            );
            await updateShelf(user.uid, updatedShelf);
            profile.shelf = updatedShelf;
            const cached = JSON.parse(localStorage.getItem('rl_profile') || '{}');
            if (cached.shelf) { cached.shelf = updatedShelf; localStorage.setItem('rl_profile', JSON.stringify(cached)); }
          }
        }

        // Current cover first (selected state)
        if (currentUrl) {
          const item = document.createElement('div');
          item.className = 'cover-picker-item selected';
          item.title = 'Current cover';
          item.innerHTML = `<img src="${esc(currentUrl)}" alt="" loading="lazy">`;
          item.addEventListener('click', () => overlay.remove());
          grid.appendChild(item);
        }

        // Upload custom cover
        const uploadInput = document.createElement('input');
        uploadInput.type = 'file';
        uploadInput.accept = 'image/*';
        uploadInput.style.display = 'none';
        modal.appendChild(uploadInput);

        const uploadItem = document.createElement('div');
        uploadItem.className = 'cover-picker-item cover-picker-upload';
        uploadItem.title = 'Upload custom cover';
        uploadItem.innerHTML = `<div class="cover-picker-upload-inner">+</div>`;
        uploadItem.addEventListener('click', () => uploadInput.click());
        uploadInput.addEventListener('change', async () => {
          const file = uploadInput.files[0];
          if (!file) return;
          uploadInput.value = '';
          uploadItem.style.opacity = '0.5';
          try {
            const dataUrl = await new Promise((resolve, reject) => {
              const img = new Image();
              const objectUrl = URL.createObjectURL(file);
              img.onload = () => {
                URL.revokeObjectURL(objectUrl);
                const MAX_W = 400, MAX_H = 600;
                const scale = Math.min(MAX_W / img.width, MAX_H / img.height, 1);
                const w = Math.round(img.width * scale);
                const h = Math.round(img.height * scale);
                const canvas = document.createElement('canvas');
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                resolve(canvas.toDataURL('image/jpeg', 0.85));
              };
              img.onerror = reject;
              img.src = objectUrl;
            });
            await pickCover(dataUrl);
          } catch (e) {
            console.error(e);
            uploadItem.style.opacity = '';
            alert('Could not load that image.');
          }
        });
        grid.appendChild(uploadItem);

        if (!filteredEditions.length) {
          const msg = document.createElement('div');
          msg.style.cssText = 'font-size:.85rem;color:var(--text-muted);width:100%;padding-top:.25rem';
          msg.textContent = currentUrl ? 'No other edition covers found.' : 'No edition covers found.';
          grid.appendChild(msg);
        }

        filteredEditions.forEach(ed => {
          const url = ed.image.url;
          const item = document.createElement('div');
          item.className = 'cover-picker-item';
          if (ed.publisher?.name || ed.release_year) item.title = [ed.publisher?.name, ed.release_year].filter(Boolean).join(' · ');
          item.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy">`;
          item.addEventListener('click', () => { item.style.opacity = '0.5'; pickCover(url); });
          grid.appendChild(item);
        });

        // Google Books covers
        const seenUrls = new Set([currentUrl, ...filteredEditions.map(e => e.image.url)].filter(Boolean));
        const gbData  = await gbFetch;
        const gbItems = gbData?.items || [];
        const gbCovers = [];
        for (const item of gbItems) {
          const links = item.volumeInfo?.imageLinks;
          if (!links) continue;
          let url = links.thumbnail || links.smallThumbnail;
          if (!url) continue;
          url = url.replace(/^http:/, 'https:').replace(/&edge=curl/, '').replace(/zoom=\d/, 'zoom=0');
          if (seenUrls.has(url)) continue;
          seenUrls.add(url);
          gbCovers.push(url);
        }
        if (gbCovers.length) {
          const sep = document.createElement('div');
          sep.style.cssText = 'width:100%;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text-muted);padding:.5rem 0 .2rem';
          sep.textContent = 'Google Books';
          grid.appendChild(sep);
          gbCovers.forEach(url => {
            const item = document.createElement('div');
            item.className = 'cover-picker-item';
            item.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy">`;
            item.addEventListener('click', () => { item.style.opacity = '0.5'; pickCover(url); });
            grid.appendChild(item);
          });
        }
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<span style="font-size:.85rem;color:var(--text-muted)">Failed to load covers.</span>';
      }
    }

    function tsOf(book, field) {
      const ts = book[field];
      if (!ts) return 0;
      if (ts.seconds != null) return ts.seconds;
      if (ts.toDate) return ts.toDate().getTime() / 1000;
      return 0;
    }

    function formatDateTs(ts, precision) {
      if (!ts?.toDate || !precision) return 'Unknown';
      const d = ts.toDate();
      if (precision === 'year') return String(d.getFullYear());
      if (precision === 'day')  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
      return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
    }

    function createPartialDatePicker(ts, precision) {
      const d = ts?.toDate?.() ?? null;
      const initYear  = d ? d.getFullYear() : '';
      const initMonth = (d && precision !== 'year') ? d.getMonth() + 1 : '';
      const initDay   = (d && precision !== 'year' && precision !== 'month') ? d.getDate() : '';

      const wrap = document.createElement('div');
      wrap.className = 'date-picker-partial';

      function makeNumInput(placeholder, min, max, value) {
        const inp = document.createElement('input');
        inp.type = 'number';
        inp.placeholder = placeholder;
        inp.min = min;
        inp.max = max;
        inp.inputMode = 'numeric';
        if (value !== '') inp.value = value;
        return inp;
      }

      const dayIn   = makeNumInput('DD',   '1',    '31',   initDay);
      const monthIn = makeNumInput('MM',   '1',    '12',   initMonth);
      const yearIn  = makeNumInput('YYYY', '1900', '2099', initYear);

      wrap.append(dayIn, monthIn, yearIn);

      wrap.getDate = () => {
        const year = parseInt(yearIn.value);
        if (!year) return { date: null, precision: null };
        const month = parseInt(monthIn.value) || 0;
        const day   = parseInt(dayIn.value) || 0;
        if (!month) return { date: new Date(year, 0, 1, 12, 0, 0), precision: 'year' };
        if (!day)   return { date: new Date(year, month - 1, 1, 12, 0, 0), precision: 'month' };
        return { date: new Date(year, month - 1, Math.min(day, 31), 12, 0, 0), precision: 'day' };
      };

      return wrap;
    }

    function makeDateEl(label, ts, field, book, withActivity = true) {
      const precision = book[field + 'Precision'] ?? null;
      const el = document.createElement('div');
      el.style.cssText = 'display:flex;align-items:center;gap:.4rem;margin-top:.35rem';
      if (label) {

        lbl.textContent = label;

      const val = document.createElement('span');
      val.className = 'book-date-editable';
      val.style.cssText = 'font-size:.8rem;color:var(--text)';
      val.textContent = (ts && precision) ? formatDateTs(ts, precision) : '—';

      const picker = createPartialDatePicker(ts, precision);
      picker.style.display = 'none';

      const clearDateBtn = document.createElement('button');
      clearDateBtn.type = 'button';
      clearDateBtn.textContent = 'Clear';
      clearDateBtn.style.cssText = 'font-size:.72rem;color:var(--text-muted);background:none;border:none;cursor:pointer;font-family:inherit;padding:0 .1rem;flex-shrink:0';
      clearDateBtn.addEventListener('mousedown', e => {
        e.preventDefault();
        picker.querySelectorAll('input[type="number"]').forEach(i => i.value = '');
        collapse();
      });
      picker.appendChild(clearDateBtn);

      el.append(val, picker);

      let collapsing = false;
      function collapse() {
        if (collapsing) return;
        collapsing = true;
        const { date, precision: newPrec } = picker.getDate();
        picker.style.display = 'none';
        val.style.display = '';
        if (!date) {
          val.textContent = '—';
          if (book[field]) {
            book[field] = null;
            book[field + 'Precision'] = null;
            markDirty();
            const pending = [clearBookDate(user.uid, book.id, field).catch(console.error)];
            if (withActivity) {
              const type = field === 'addedAt' ? 'started' : 'finished';
              const bookInfo = { title: book.title, author: book.author, gbid: book.gbid,
                rating: book.rating, review: book.review, username: profile.username, bookId: book.id };
              pending.push(syncBookActivity(user.uid, type, null, null, bookInfo).catch(console.error));
            }
            Promise.all(pending).finally(markClean);
          }
          return;
        }
        book[field] = { toDate: () => date };
        book[field + 'Precision'] = newPrec;
        val.textContent = formatDateTs(book[field], newPrec);
        const updates = { [field]: date, [field + 'Precision']: newPrec };
        const bookInfo = withActivity ? {
          title: book.title, author: book.author, gbid: book.gbid,
          rating: book.rating, review: book.review, username: profile.username, bookId: book.id
        } : null;
        markDirty();
        updateBookDates(user.uid, book.id, updates, bookInfo).catch(console.error).finally(markClean);
      }

      val.addEventListener('click', () => {
        collapsing = false;
        val.style.display = 'none';
        picker.style.display = '';
        picker.querySelector('select, input')?.focus();
        function onOutside(e) {
          if (picker.contains(e.target)) return;
          collapse();
          document.removeEventListener('mousedown', onOutside);
          document.removeEventListener('touchstart', onOutside);
        }
        document.addEventListener('mousedown', onOutside);
        document.addEventListener('touchstart', onOutside, { passive: true });
      });

      picker.addEventListener('focusout', e => {
        if (picker.contains(e.relatedTarget)) return;
        collapse();
      });

      picker.addEventListener('keydown', e => {
        if (e.key === 'Escape') { e.stopPropagation(); picker.style.display = 'none'; val.style.display = ''; }
        if (e.key === 'Enter')  collapse();
      });

      return el;
    }

    // Language picker. A select, not an input+datalist: a datalist filters its

    // Portuguese would offer nothing else until the field was cleared.

    // A stored language outside the list is kept as its own option, so an
    // unusual one set earlier is never silently replaced.
    function makeLanguageSelect(current) {
      const sel = document.createElement('select');
      sel.className = 'page-input';
      sel.style.cssText = 'font-size:.8rem;width:auto';
      const known = current && !LANGUAGES.includes(current) ? [current, ...LANGUAGES] : LANGUAGES;

        const o = document.createElement('option');

            o.value = v; o.textContent = v;

            control.appendChild(o);
          });
        } else if (type === 'tags') {
          control = document.createElement('input');
          control.type = 'text';

          control.style.cssText = 'flex:1;font-size:.8rem;text-align:left';
          if (type === 'number' && key !== 'releaseYear') control.min = '0';

      async function doSaveBookMeta() {
        const updates = {};
        fieldDefs.forEach(({ key, type }) => {
          const raw = inputs[key].value.trim();
          let val;
          if (type === 'number') {
            val = parseInt(raw) || null;
          } else if (type === 'tags') {
            val = raw ? raw.split(',').map(s => s.trim()).filter(Boolean) : null;
          } else {
            val = raw || null;
          }
          const existing = type === 'tags' ? (book[key] || null) : (book[key] ?? null);
          const differs  = type === 'tags' ? JSON.stringify(val) !== JSON.stringify(existing) : val !== existing;
          if (differs) updates[key] = val;
        });
        if (!Object.keys(updates).length) return;
        markDirty();
        try {
        const siblings = book.gbid ? allBooks.filter(b => b.id !== book.id && b.gbid === book.gbid) : [];
        await Promise.all([
          updateBookMeta(user.uid, book.id, updates),
          ...siblings.map(sib => updateBookMeta(user.uid, sib.id, updates)),
        ]);
        [book, ...siblings].forEach(b => {
          Object.assign(b, updates);
          const el = readingList.querySelector(`[data-id="${b.id}"]`) || finishedList.querySelector(`[data-id="${b.id}"]`);
          if (el) {
            if (updates.title    != null) { el.dataset.title    = updates.title.toLowerCase(); }
            if ('author'   in updates)    { el.dataset.author   = (updates.author   || '').toLowerCase(); }
            if ('country'      in updates) { el.dataset.country = (updates.country      || '').toLowerCase(); }
            if ('authorGender' in updates) { el.dataset.gender  = (updates.authorGender || '').toLowerCase(); }
            if ('genres'       in updates) { el.dataset.genre   = (updates.genres || []).map(g => g.toLowerCase()).join(','); }
            const titleEl  = el.querySelector('.book-title');
            const authorEl = el.querySelector('.book-author');
            if (titleEl  && updates.title  != null) titleEl.textContent  = updates.title;
            if (authorEl && 'author' in updates) { authorEl.textContent = updates.author || ''; if (authorEl.tagName === 'A') authorEl.href = `../author/?slug=${toAuthorSlug(updates.author || '')}&name=${encodeURIComponent(updates.author || '')}`; }
          }
        });
        if (updates.title) {
          const titleEl = card.querySelector('.book-title');
          if (titleEl) titleEl.textContent = updates.title;
          if (coverCell) {
            coverCell.dataset.title = updates.title.toLowerCase();
            const cellTitle = coverCell.querySelector('.library-cover-title');
            if (cellTitle) cellTitle.textContent = updates.title;
          }
        }
        if (Object.prototype.hasOwnProperty.call(updates, 'author')) {
          const authorEl = card.querySelector('.book-author');
          if (authorEl) { authorEl.textContent = updates.author || ''; if (authorEl.tagName === 'A') authorEl.href = `../author/?slug=${toAuthorSlug(updates.author || '')}&name=${encodeURIComponent(updates.author || '')}`; }
          if (coverCell) coverCell.dataset.author = (updates.author || '').toLowerCase();
        }
        } finally {
          markClean();
        }
      }

      card.appendChild(section);
      return { section, doSaveBookMeta };
    }

    function buildListsPanel(book) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Lists ▾';
      btn.style.cssText = 'font-size:.65rem;font-family:inherit;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;color:var(--text-muted);padding:0 .4rem;height:1.5rem;white-space:nowrap;line-height:1;flex-shrink:0';

      const drop = document.createElement('div');
      drop.style.cssText = 'display:none;position:fixed;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:1000;min-width:160px;padding:.25rem 0';
      document.body.appendChild(drop);

      btn.addEventListener('click', e => {
        e.stopPropagation();
        if (drop.style.display !== 'none') { drop.style.display = 'none'; return; }
        const rect = btn.getBoundingClientRect();
        drop.style.top  = rect.bottom + 4 + 'px';
        drop.style.left = rect.left + 'px';
        drop.style.display = '';
      });
      document.addEventListener('click', () => { drop.style.display = 'none'; });
      drop.addEventListener('click', e => e.stopPropagation());

      const wrap = btn;

      const membership = {};
      allLists.forEach(l => { membership[l.id] = (l.books || []).some(b => b.gbid && b.gbid === book.gbid); });

      function buildDrop() {
        drop.innerHTML = '';
        allLists.forEach(l => {
          // The want-to-read list will not take a book you are reading or have
          // read. Only adding is blocked — a book already on the list stays
          // removable, which is how one you have since started comes off.
          const blocked = l.isDefault && !membership[l.id] ? wantToReadBlock(book) : null;
          const item = document.createElement('div');
          item.style.cssText = 'display:flex;align-items:center;gap:.5rem;padding:.4rem .75rem;font-size:.85rem;cursor:' + (blocked ? 'default' : 'pointer');
          const check = document.createElement('span');
          check.style.cssText = 'color:var(--accent);width:1em;flex-shrink:0';
          check.textContent = membership[l.id] ? '✓' : '';
          const name = document.createElement('span');
          name.textContent = l.name;
          item.append(check, name);
          if (blocked) {
            // Greyed with the reason rather than hidden: a list that silently
            // vanishes reads as a bug.
            item.style.opacity = '.55';
            const why = document.createElement('span');
            why.style.cssText = 'margin-left:auto;padding-left:.5rem;font-size:.72rem;color:var(--text-muted)';
            why.textContent = blocked;
            item.appendChild(why);
            drop.appendChild(item);
            return;
          }
          item.addEventListener('mouseenter', () => item.style.background = 'var(--bg-alt)');
          item.addEventListener('mouseleave', () => item.style.background = '');
          item.addEventListener('click', async e => {
            e.stopPropagation();
            item.style.opacity = '.5';
            if (membership[l.id]) {
              await removeBookFromList(user.uid, l.id, book.gbid);
              membership[l.id] = false;
              l.books = (l.books || []).filter(b => b.gbid !== book.gbid);
            } else {
              const entry = { gbid: book.gbid || '', title: book.title, author: book.author || '', coverUrl: book.coverUrl || '' };
              await addBookToList(user.uid, l.id, entry);
              membership[l.id] = true;
              l.books = [...(l.books || []), entry];
            }
            item.style.opacity = '';
            buildDrop();
          });
          drop.appendChild(item);
        });
      }

      buildDrop();
      return wrap;
    }
