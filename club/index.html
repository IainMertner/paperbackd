  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>club - paperbackd</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    /* Inked edge on every card on the page. isolation:isolate because these sit
       in normal page flow: with no stacking context of their own, the z-index:-1
       layer falls behind the opaque page background and disappears. */
    .card {
      position: relative;
      isolation: isolate;
      background: transparent;
      border: none;
      box-shadow: none;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      filter: url(#ink-edge);
      z-index: -1;
    }
    /* Same tab bar as the stats page, so the two read as one pattern. */
    .stats-tab-bar {
      display: flex;
      border-bottom: 2px solid var(--border);
      margin: .25rem 0 .75rem;
    }
    .stats-tab-btn {
      flex: 1;
      padding: .5rem .25rem;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      font-size: .7rem;
      cursor: pointer;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      transition: color .15s;
    }
    .stats-tab-btn.active {
      /* The club's own colour, which renderHeader puts on the document root.
         Falls back to the accent for a club that has not picked one. */
      border-bottom-color: var(--ring-color, var(--accent));
      color: var(--text);
    }
    .meeting-row {
      display: flex;
      gap: .75rem;
      align-items: flex-start;
      padding: .625rem 0;
      border-bottom: 1px solid var(--border);
    }
    .meeting-row:last-child { border-bottom: none; }
    .meeting-cover {
      width: 42px;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 2px;
      flex-shrink: 0;
      background: var(--bg-alt);
    }
    .meeting-date { font-size: .72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; }
    .meeting-book { font-weight: 600; font-size: .9rem; margin-top: .1rem; }
    .meeting-who  { font-size: .78rem; color: var(--text-muted); margin-top: .2rem; }
    /* The one button on the site that is meant to feel like pressing a button.
       Chunky, in the club's own colour, with a hard shadow it sinks into when
       pressed rather than a soft glow. --spin-ink is set from JS so the label
       stays legible on the lighter theme colours. */
    .spin-btn {
      display: block;
      margin: .9rem auto 0;
      padding: .7rem 2.6rem;
      font-family: 'Arvo', serif;
      font-size: 1.05rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .16em;
      color: var(--spin-ink, #fff);
      background: var(--ring-color, var(--accent));
      border: none;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 3px 0 rgba(0, 0, 0, .22);
      transition: transform .12s, box-shadow .12s, filter .12s;
    }
    .spin-btn:hover:not(:disabled) {
      filter: brightness(1.07);
      transform: translateY(-1px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, .22);
    }
    .spin-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, .22);
    }
    /* Grey and flat: a disabled button that still looks pressable reads as
       broken rather than unavailable. */
    .spin-btn:disabled {
      background: var(--bg-alt);
      color: var(--text-muted);
      box-shadow: none;
      cursor: default;
      filter: none;
      transform: none;
    }
    /* Mid-spin it keeps the club colour and breathes, so the page looks busy
       rather than broken while the wheel turns. */
    .spin-btn.is-spinning:disabled {
      background: var(--ring-color, var(--accent));
      color: var(--spin-ink, #fff);
      animation: spin-pulse 1s ease-in-out infinite;
    }
    @keyframes spin-pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .72; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spin-btn { transition: none; }
      .spin-btn.is-spinning:disabled { animation: none; }
    }
    /* The star is drawn at its full size inside the box rather than spilling
       out of it, so the spikes cannot be clipped. -22px on a 76px avatar makes
       the box 120px, which is what the viewBox below assumes. */
    .club-ring-svg {
      position: absolute;
      inset: -22px;
      width: calc(100% + 44px);
      height: calc(100% + 44px);
      pointer-events: none;
      z-index: 0;
    }
    .club-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 1rem;
      letter-spacing: .12em;
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: .4rem .6rem;
      display: inline-block;
    }
    .member-row {
      display: flex;
      align-items: center;
      gap: .6rem;
      padding: .5rem 0;
      border-bottom: 1px solid var(--border);
    }
    .member-row:last-child { border-bottom: none; }
    .club-suggest {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-top: .35rem;
      max-height: 260px;
      overflow-y: auto;
      background: var(--bg-card);
    }
    .club-suggest-item {
      display: flex;
      gap: .5rem;
      align-items: center;
      padding: .45rem .55rem;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    .club-suggest-item:last-child { border-bottom: none; }
    .club-suggest-item:hover { background: var(--bg-alt); }
  </style>
</head>

      </filter>
    </defs>

  <script src="../js/main.js"></script>
  <script>document.body.classList.add('auth-loading');</script>
  <script type="module">
    import { requireAuth } from '../js/auth.js';
    import {
      watchClub, watchClubMeetings, updateClub, deleteClub,
      createClubMeeting, updateClubMeeting, deleteClubMeeting,
      setClubMemberRole, removeClubMember, refreshClubMemberProfile, leaveClub,
      watchClubRecommendations, setClubRecommendation, clearClubRecommendation, applySpinResult,
      setClubIcon, getProfilesByUids,
    } from '../js/firebase.js';
    import { searchBooks } from '../js/hardcover.js';
    import {
      isClubMember, isClubAdmin, isClubOwner, memberList, canDemote,
      splitMeetings, attendanceLabel, suggesterLabel,
      wheelOrder, canSpin, segmentBounds, segmentColour, targetRotation, pickWinnerIndex, uniformWeights,
      selectionWeights, selectionChances, SELECTION_DEFAULTS,
      spikeRingPath, spikeRingPoints, spikeCountFor,
    } from '../js/club-utils.js';
    import { esc, THEMES, themeColour, readableInk } from '../js/utils.js';
    import { openCropModal } from '../js/crop-image.js';

    let user, profile;
    try { ({ user, profile } = await requireAuth()); }
    finally { document.body.classList.remove('auth-loading'); }

    const clubId = new URLSearchParams(location.search).get('id');
    const headerEl   = document.getElementById('club-header');
    const tabBar     = document.getElementById('tab-bar');
    const panels = {
      meetings: document.getElementById('panel-meetings'),
      recs:     document.getElementById('panel-recs'),
      settings: document.getElementById('panel-settings'),
    };

    if (!clubId) {
      headerEl.innerHTML = '<p style="color:var(--text-muted)">No club specified.</p>';
      throw new Error('no club id');
    }

    let club = null;
    let meetings = [];
    let recommendations = [];
    let profileSynced = false;
    let spinning = false;
    // Avatars are not kept on the club document, so the roster reads them from
    // the user documents once per load. uid -> { avatarUrl, avatarBorderColor }.
    let memberFaces = new Map();

    // ── tabs ──────────────────────────────────────────────────────────────────
    const tabBtns = {
      meetings: document.getElementById('tab-meetings'),
      recs:     document.getElementById('tab-recs'),
      settings: document.getElementById('tab-settings'),
    };
    let activeTab = localStorage.getItem('club-tab') || 'meetings';

    function switchTab(tab) {
      activeTab = tab;
      for (const key of Object.keys(panels)) {
        panels[key].style.display = key === tab ? '' : 'none';
        tabBtns[key].classList.toggle('active', key === tab);
      }
      localStorage.setItem('club-tab', tab);
    }
    for (const key of Object.keys(tabBtns)) {
      tabBtns[key].addEventListener('click', () => switchTab(key));
    }

    function fmtDate(ts) {
      const d = ts?.toDate?.() ?? (ts instanceof Date ? ts : null);
      if (!d) return 'No date set';
      return d.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function avatarEl(member) {
      const face = memberFaces.get(member.uid) || {};
      const av = document.createElement('div');
      av.className = 'friend-avatar';
      av.style.flexShrink = '0';
      const border = face.avatarBorderColor || member.avatarBorderColor;
      if (border) av.style.borderColor = border;
      if (face.avatarUrl) av.innerHTML = `<img src="${esc(face.avatarUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`;
      else av.textContent = (member.username?.[0] || '?').toUpperCase();
      return av;
    }

    // One pass over the roster's user documents. Decoration on a page that is
    // complete without it, so a failure just leaves initials in place.
    async function loadMemberFaces() {
      const uids = memberList(club).map(m => m.uid);
      if (!uids.length) return;
      try {
        const profiles = await getProfilesByUids(uids);
        memberFaces = new Map(profiles.map(pr => [pr.uid, {
          avatarUrl: pr.avatarUrl || '',
          avatarBorderColor: pr.avatarBorderColor || '',
        }]));
        renderSettings();
      } catch (err) {
        console.warn('Could not load member avatars', err);
      }
    }

    // ── header ────────────────────────────────────────────────────────────────
    // Built from the profile page's own header parts rather than a card, so a
    // club reads as a place with a name and a face the way a person does. The
    // club's initial stands in for the avatar until clubs have images of their
    // own, and the ring falls back to the accent since there is no club colour
    // to take it from yet.
    function renderHeader() {
      const count = memberList(club).length;
      // Set on the document rather than the header, so every --ring-color in the
      // page follows the club: the ring now, anything themed later.
      const colour = themeColour(club.ringColor);
      if (colour) document.documentElement.style.setProperty('--ring-color', colour);
      else document.documentElement.style.removeProperty('--ring-color');
      headerEl.innerHTML = `<div class="profile-meta-row">
        <div class="avatar-ink-ring">
          <svg class="club-ring-svg" viewBox="0 0 120 120" aria-hidden="true"><path d="${spikeRingPath(60, 60, 43, 47, 14)}" style="fill:var(--ring-color,var(--accent))"/></svg>
          <div class="profile-avatar-sm">${club.iconUrl
            ? `<img src="${esc(club.iconUrl)}" alt="">`
            : esc((club.name[0] || '?').toUpperCase())}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:0;flex:1;min-width:0">
          <div class="profile-display-name">${esc(club.name)}<span class="title-dot">.</span></div>
          <div class="profile-username">${count} member${count === 1 ? '' : 's'}</div>
          ${club.description ? `<div class="club-current" style="margin-top:.35rem">${esc(club.description)}</div>` : ''}
        </div>
      </div>`;
    }

    // Who put a book forward. Weighted selection reads this back to work out who
    // has been winning lately, so a meeting recorded without it counts against
    // nobody - which is right for a book an admin chose, and wrong for one a
    // member suggested. Hence the field.
    function suggesterSelect(selected) {
      const sel = document.createElement('select');
      sel.className = 'join-club-input';
      sel.style.cssText = 'width:100%;box-sizing:border-box';
      sel.appendChild(new Option('Nobody', ''));
      for (const member of memberList(club)) {
        sel.appendChild(new Option(member.username || '(no name)', member.uid));
      }
      // A suggester who has since left the club is not in the roster, so their
      // uid would vanish from the list and be silently reassigned on save.
      if (selected && !memberList(club).some(m => m.uid === selected)) {
        sel.appendChild(new Option('A former member', selected));
      }
      sel.value = selected || '';
      return sel;
    }

    // ── book picker ───────────────────────────────────────────────────────────
    // A compact search used when choosing the book for a meeting. Goes through
    // searchBooks so admin remaps and title overrides apply, same as everywhere.
    function bookPicker(onPick, initial) {
      const wrap = document.createElement('div');
      const chosen = document.createElement('div');
      chosen.style.cssText = 'font-size:.85rem;margin-bottom:.35rem';

      const input = document.createElement('input');
      input.className = 'join-club-input';
      input.type = 'text';
      input.placeholder = 'Search for a book';
      input.autocomplete = 'off';
      input.style.cssText = 'width:100%;box-sizing:border-box';

      const suggest = document.createElement('div');
      suggest.className = 'club-suggest';
      suggest.style.display = 'none';

      let picked = initial || null;

      function showChosen() {
        if (!picked) { chosen.textContent = ''; return; }
        chosen.innerHTML = `<strong>${esc(picked.title)}</strong>${picked.author ? ` - ${esc(picked.author)}` : ''}
          <button type="button" id="bp-clear" style="margin-left:.4rem;background:none;border:none;color:var(--text-muted);cursor:pointer;font-family:inherit;font-size:.8rem;text-decoration:underline">change</button>`;
        chosen.querySelector('#bp-clear').addEventListener('click', () => {
          picked = null;
          onPick(null);
          showChosen();
          input.style.display = '';
          input.focus();
        });
        input.style.display = 'none';
      }

      let timer;
      input.addEventListener('input', () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 2) { suggest.style.display = 'none'; return; }
        timer = setTimeout(async () => {
          try {
            const docs = await searchBooks(q, 8);
            suggest.innerHTML = '';
            if (!docs.length) { suggest.style.display = 'none'; return; }
            for (const d of docs) {
              const author = Array.isArray(d.author_names) ? (d.author_names[0] || '') : (d.author_names || '');
              const item = document.createElement('div');
              item.className = 'club-suggest-item';
              item.innerHTML = `${d.image?.url ? `<img src="${esc(d.image.url)}" alt="" style="width:28px;aspect-ratio:2/3;object-fit:cover;border-radius:2px;flex-shrink:0">` : ''}
                <div style="min-width:0"><div style="font-size:.85rem;font-weight:600">${esc(d.title || '')}</div>
                <div style="font-size:.75rem;color:var(--text-muted)">${esc(author)}${d.release_year ? ` - ${esc(String(d.release_year))}` : ''}</div></div>`;
              item.addEventListener('click', () => {
                picked = { gbid: d.slug || String(d.id), title: d.title || '', author, coverUrl: d.image?.url || '' };
                onPick(picked);
                suggest.style.display = 'none';
                input.value = '';
                showChosen();
              });
              suggest.appendChild(item);
            }
            suggest.style.display = '';
          } catch (err) {
            console.error('Book search failed', err);
            suggest.style.display = 'none';
          }
        }, 280);
      });

      wrap.append(chosen, input, suggest);
      showChosen();
      return wrap;
    }

    // ── meetings tab ──────────────────────────────────────────────────────────
    function meetingRow(meeting, { showAttendance }) {
      const row = document.createElement('div');
      row.className = 'meeting-row';

      if (meeting.coverUrl) {
        const img = document.createElement('img');
        img.className = 'meeting-cover';
        img.src = meeting.coverUrl;
        img.alt = '';
        row.appendChild(img);
      } else {
        const ph = document.createElement('div');
        ph.className = 'meeting-cover';
        row.appendChild(ph);
      }

      const body = document.createElement('div');
      body.style.cssText = 'flex:1;min-width:0';

      // Only a meeting that has happened carries a date, so a missing one is
      // the normal state of the next meeting rather than something to announce.
      const when = meeting.date?.toDate?.() ?? (meeting.date instanceof Date ? meeting.date : null);
      let date = null;
      if (when) {
        date = document.createElement('div');
        date.className = 'meeting-date';
        date.textContent = fmtDate(meeting.date);
      }

      const book = document.createElement('div');
      book.className = 'meeting-book';
      if (meeting.gbid) {
        const a = document.createElement('a');
        a.href = `../book/?gbid=${encodeURIComponent(meeting.gbid)}`;
        a.textContent = meeting.title || 'Untitled';
        a.style.color = 'inherit';
        book.appendChild(a);
      } else {
        book.textContent = meeting.title || 'No book chosen yet';
      }
      if (meeting.author) {
        const by = document.createElement('span');
        by.style.cssText = 'font-weight:400;color:var(--text-muted)';
        by.textContent = ` - ${meeting.author}`;
        book.appendChild(by);
      }

      if (date) body.appendChild(date);
      body.appendChild(book);

      // Shown on the next meeting too, not just the history: whose book the
      // club is currently reading is worth knowing before the meeting as well
      // as after it.
      const pick = suggesterLabel(meeting, club);
      if (pick) {
        const picked = document.createElement('div');
        picked.className = 'meeting-who';
        picked.textContent = pick;
        body.appendChild(picked);
      }

      if (showAttendance) {
        const who = document.createElement('div');
        who.className = 'meeting-who';
        who.textContent = attendanceLabel(meeting, club);
        body.appendChild(who);
      }

      if (meeting.notes) {
        const notes = document.createElement('div');
        notes.className = 'meeting-who';
        notes.style.whiteSpace = 'pre-wrap';
        notes.textContent = meeting.notes;
        body.appendChild(notes);
      }

      row.appendChild(body);
      return row;
    }

    function renderMeetings() {
      const admin = isClubAdmin(club, user.uid);
      const { next, alsoPlanned, history } = splitMeetings(meetings);
      panels.meetings.innerHTML = '';

      // -- next meeting --
      const nextCard = document.createElement('div');
      nextCard.className = 'card';
      nextCard.style.marginBottom = '.75rem';
      const nextTitle = document.createElement('p');
      nextTitle.className = 'section-title';
      nextTitle.style.marginTop = '0';
      nextTitle.textContent = 'Next meeting';
      nextCard.appendChild(nextTitle);

      // Nothing here is scheduled. A meeting has no date until it has happened,
      // at which point an admin says so and it drops into the history. What the
      // card shows before then is simply the book the wheel landed on.
      if (next) {
        nextCard.appendChild(meetingRow(next, { showAttendance: false }));
      } else {
        const none = document.createElement('p');
        none.style.cssText = 'color:var(--text-muted);font-size:.85rem;margin:0';
        none.textContent = admin
          ? 'No book chosen yet. Spin the wheel on the Books tab to pick one.'
          : 'No book chosen yet. An admin will spin the wheel to pick one.';
        nextCard.appendChild(none);
      }

      if (admin) {
        const actions = document.createElement('div');
        actions.style.cssText = 'display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem';

        // Offered whether or not a book has been chosen: a club that met without
        // using the wheel still has a meeting worth recording.
        const happened = document.createElement('button');
        happened.className = 'btn-update';
        happened.textContent = 'Meeting happened';
        happened.addEventListener('click', () => openMeetingHappened(next));
        actions.appendChild(happened);

        if (next) {
          const edit = document.createElement('button');
          edit.className = 'btn-update';
          edit.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-muted)';
          edit.textContent = 'Change book';
          edit.addEventListener('click', () => openMeetingForm(next));

          const del = document.createElement('button');
          del.className = 'btn-update';
          del.style.cssText = 'background:none;border:1px solid var(--border);color:var(--text-muted)';
          del.textContent = 'Clear';
          del.addEventListener('click', async () => {
            if (!confirm('Clear the next book? It will not appear in the history.')) return;
            await deleteClubMeeting(clubId, next.id);
          });

          actions.append(edit, del);
        }
        nextCard.appendChild(actions);
      }
      panels.meetings.appendChild(nextCard);

      // More than one unheld meeting should not happen, but if it does it is
      // better seen than silently dropped.
      if (alsoPlanned.length) {
        const extra = document.createElement('div');
        extra.className = 'card';
        extra.style.marginBottom = '.75rem';
        const t = document.createElement('p');
        t.className = 'section-title';
        t.style.marginTop = '0';
        t.textContent = 'Also planned';
        extra.appendChild(t);
        for (const m of alsoPlanned) extra.appendChild(meetingRow(m, { showAttendance: false }));
        panels.meetings.appendChild(extra);
      }

      // -- history --
      const histCard = document.createElement('div');
      histCard.className = 'card';
      const histTitle = document.createElement('p');
      histTitle.className = 'section-title';
      histTitle.style.marginTop = '0';
      histTitle.textContent = `Meeting history${history.length ? ` (${history.length})` : ''}`;
      histCard.appendChild(histTitle);

      if (!history.length) {
        const none = document.createElement('p');
        none.style.cssText = 'color:var(--text-muted);font-size:.85rem;margin:0';
        none.textContent = 'No meetings yet.';
        histCard.appendChild(none);
      } else {
        const linkBtn = 'background:none;border:none;color:var(--text-muted);cursor:pointer;font-family:inherit;font-size:.75rem;text-decoration:underline;padding:0;text-align:right';
        for (const m of history) {
          const row = meetingRow(m, { showAttendance: true });
          if (admin) {
            const actions = document.createElement('div');
            actions.style.cssText = 'display:flex;flex-direction:column;gap:.25rem;flex-shrink:0;align-self:flex-start';

            const edit = document.createElement('button');
            edit.textContent = 'Edit';
            edit.style.cssText = linkBtn;
            // The full dialog, not the change-book one: a past meeting's
            // attendance is the thing most likely to need correcting.
            edit.addEventListener('click', () => openMeetingHappened(m));

            const del = document.createElement('button');
            del.textContent = 'Delete';
            del.style.cssText = linkBtn;
            del.addEventListener('click', async () => {
              // Names what goes, and says what else it changes: the weighting is
              // computed from this history every time the wheel is drawn, so
              // removing a meeting quietly alters everyone's odds.
              const what = m.title ? `"${m.title}"` : 'this meeting';
              if (!confirm(`Delete ${what} from ${fmtDate(m.date)}?

Its attendance and whose pick it was go with it, which changes the wheel's weighting. This cannot be undone.`)) return;
              del.disabled = true;
              try { await deleteClubMeeting(clubId, m.id); }
              catch (err) { console.error('Deleting meeting failed', err); del.disabled = false; }
            });

            actions.append(edit, del);
            row.appendChild(actions);
          }
          histCard.appendChild(row);
        }
      }
      panels.meetings.appendChild(histCard);
    }

    // -- schedule / edit a meeting --
    function openMeetingForm(existing) {
      const overlay = document.createElement('div');
      overlay.className = 'cover-picker-overlay';
      const modal = document.createElement('div');
      modal.className = 'cover-picker-modal';
      modal.style.maxWidth = '30rem';
      // Only ever the meeting that has not happened yet - a past one is edited
      // through openMeetingHappened, which has attendance too. So there is no
      // date here: a club picks a book, then meets when it meets, and the date
      // is set at the point someone says the meeting took place.
      modal.innerHTML = `<div style="font-weight:600;margin-bottom:.75rem">Change book</div>
        <label style="font-size:.78rem;color:var(--text-muted)">Book</label>
        <div id="mf-book" style="margin:.2rem 0 .75rem"></div>
        <label style="font-size:.78rem;color:var(--text-muted)">Whose pick</label>
        <div id="mf-suggester" style="margin:.2rem 0 .75rem"></div>
        <label style="font-size:.78rem;color:var(--text-muted)">Notes</label>
        <textarea id="mf-notes" class="join-club-input" rows="3" maxlength="1000" style="width:100%;box-sizing:border-box;font-family:inherit;text-align:left;resize:vertical;margin-top:.2rem"></textarea>
        <div id="mf-status" style="display:none;font-size:.82rem;margin-top:.5rem"></div>
        <div style="display:flex;gap:.5rem;justify-content:flex-end;margin-top:.75rem">

          <button type="button" id="mf-save" class="btn-update">Save</button>
        </div>`;

      const notesEl = modal.querySelector('#mf-notes');

        : null;
      modal.querySelector('#mf-book').appendChild(bookPicker(b => { book = b; }, book));

      // Editable here too, so a wrong attribution in the history can be put

      const mfSuggester = suggesterSelect(existing?.suggestedBy);
      modal.querySelector('#mf-suggester').appendChild(mfSuggester);

      if (existing) notesEl.value = existing.notes || '';

      modal.querySelector('#mf-save').addEventListener('click', async () => {
        const saveBtn = modal.querySelector('#mf-save');
        saveBtn.disabled = true;
        status.textContent = 'Saving...';
        status.style.color = 'var(--text-muted)';
        status.style.display = '';
        try {
          // Parsed as local midnight rather than through Date(string), which
          // reads a bare yyyy-mm-dd as UTC and lands on the previous day west
          // of Greenwich.
          const payload = {
            gbid: book?.gbid || '',
            title: book?.title || '',
            author: book?.author || '',
            coverUrl: book?.coverUrl || '',
            notes: notesEl.value.trim(),
            suggestedBy: mfSuggester.value || '',
          };
          if (existing) await updateClubMeeting(clubId, existing.id, payload);
          else await createClubMeeting(clubId, payload);
          overlay.remove();
        } catch (err) {
          console.error('Saving meeting failed', err);
          status.textContent = 'Could not save that.';
          status.style.color = '#c84f4f';
          saveBtn.disabled = false;
        }
