  <style>
    .reading-person {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: .85rem 0;
      border-bottom: 1px solid var(--border);
    }
    .reading-person:last-child { border-bottom: none; }

    .reading-person-head {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      width: 4.5rem;
      flex-shrink: 0;
    }
    .reading-person-name {
      font-size: .75rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    .reading-person-name:hover { text-decoration: underline; }

    .reading-person-books {
      display: flex;
      gap: .6rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }
    .reading-book {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .25rem;
      text-decoration: none;
      color: var(--text);
    }
    .reading-book-cover {
      width: 4.5rem;
      height: 6.6rem;
      object-fit: cover;
      border-radius: 2px;
      box-shadow: 0 2px 6px rgba(0,0,0,.2);
      display: block;
      flex-shrink: 0;
    }
    .reading-book-cover-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .reading-book-title {
      font-size: .65rem;
      color: var(--text-muted);
      width: 4.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: center;
    }

    .reading-empty {
      font-size: .875rem;
      color: var(--text-muted);
      padding: 2rem 0;
      text-align: center;
    }
  </style>
</head>

  <script>document.body.classList.add('auth-loading');</script>
  <script type="module">
    import { requireAuth } from '../js/auth.js';
    import { getFollowing, getReadingBooks } from '../js/firebase.js';
    import { progressPercent, orderReaders } from '../js/book-utils.js';

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    const { user, profile: myProfile } = await requireAuth();
    document.body.classList.remove('auth-loading');

    const listEl = document.getElementById('reading-list');
    const following = await getFollowing(user.uid);

    const selfReader = { uid: user.uid, username: myProfile.username, avatarUrl: myProfile.avatarUrl || null, avatarBorderColor: myProfile.avatarBorderColor || null };
    const allReaders = [selfReader, ...following];

    const rows = await Promise.all(
      allReaders.map(f => {
        const own = f.uid === user.uid;
        return getReadingBooks(f.uid)
          // Book docs are readable by any signed-in user, so keeping other
          // people's private books off this page is done here or not at all.
          // Your own stay: they are private from everyone but you.
          .then(books => ({ reader: f, books: books.filter(b => b.coverUrl && (own || !b.private)) }))
          .catch(() => ({ reader: f, books: [] }));
      })
    );

    const withBooks = orderReaders(rows.filter(r => r.books.length > 0), user.uid);

      if (!withBooks.length) {
        listEl.innerHTML = '<p class="reading-empty">Nobody is currently reading anything.</p>';
      } else {
        withBooks.forEach(({ reader, books }) => {
          const row = document.createElement('div');
          row.className = 'reading-person';

          const head = document.createElement('div');
          head.className = 'reading-person-head';

          const avatarLink = document.createElement('a');
          avatarLink.className = 'friend-avatar';
          avatarLink.href = `../profile/?u=${encodeURIComponent(reader.username)}`;
          avatarLink.style.cssText = 'text-decoration:none;color:inherit';
          if (reader.avatarBorderColor) avatarLink.style.borderColor = reader.avatarBorderColor;
          avatarLink.innerHTML = reader.avatarUrl
            ? `<img src="${esc(reader.avatarUrl)}" alt="" loading="lazy">`
            : esc((reader.username?.[0] || '?').toUpperCase());

          const nameLink = document.createElement('a');
          nameLink.className = 'reading-person-name';
          nameLink.href = `../profile/?u=${encodeURIComponent(reader.username)}`;
          nameLink.textContent = reader.username;

          head.append(avatarLink, nameLink);

          const booksDiv = document.createElement('div');
          booksDiv.className = 'reading-person-books';

          books.forEach(book => {
            const a = document.createElement('a');
            a.className = 'reading-book';
            a.href = book.gbid ? `../book/?gbid=${encodeURIComponent(book.gbid)}` : '#';

            const coverWrap = document.createElement('div');
            coverWrap.className = 'reading-book-cover-wrap';

            const img = document.createElement('img');
            img.className = 'reading-book-cover';
            img.src = book.coverUrl;
            img.alt = book.title || '';
            coverWrap.appendChild(img);

            // Audiobooks record progressPct and have no page count, so the old
            // currentPage / totalPages sum showed every one of them as unstarted.
            const pct = progressPercent(book);
            if (pct != null) {
              const track = document.createElement('div');
              track.className = 'cover-progress-track';
              const bar = document.createElement('div');
              bar.className = 'cover-progress';
              bar.style.width = `${pct}%`;
              bar.style.background = reader.avatarBorderColor || 'var(--accent)';
              track.appendChild(bar);
              coverWrap.appendChild(track);
            }

            a.appendChild(coverWrap);

            if (book.title) {
              const titleEl = document.createElement('div');
              titleEl.className = 'reading-book-title';
              titleEl.textContent = book.title;
              a.appendChild(titleEl);
            }

            booksDiv.appendChild(a);
          });

          row.append(head, booksDiv);
          listEl.appendChild(row);
        });
      }
  </script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
