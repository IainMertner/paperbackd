<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>announcements - paperbackd</title>
  <link rel="stylesheet" href="../css/main.css">
  <style>
    #announcements-list { display: flex; flex-direction: column; gap: .6rem; }

    .announcement-card {
      position: relative;
      isolation: isolate;
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: var(--radius);
      padding: .85rem 1rem 2rem;
    }
    .announcement-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius);
      background: var(--bg-card);
      box-shadow: var(--shadow);
      filter: url(#ink-edge);
      z-index: -1;
    }
    .announcement-date { font-size: .75rem; color: var(--text-muted); margin-bottom: .25rem; }
    .announcement-title { font-weight: 700; font-size: 1rem; margin-bottom: .4rem; }
    .announcement-body { font-size: .875rem; color: var(--text); line-height: 1.6; white-space: pre-wrap; }

    .announcement-actions { display: flex; gap: .75rem; margin-top: .5rem; }
    .announcement-btn {
      background: none; border: none; padding: 0;
      font-size: .75rem; cursor: pointer; font-family: inherit;
    }
    .announcement-btn-edit   { color: var(--accent); }
    .announcement-btn-delete { color: var(--text-muted); }

    .admin-add-btn {
      background: none; border: none; padding: .1rem 0 .5rem;
      font-size: .8rem; color: var(--accent); cursor: pointer;
      font-family: inherit; display: block;
    }

    .edit-input {
      width: 100%; box-sizing: border-box; padding: .3rem .4rem;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); color: var(--text); font-family: inherit;
    }
    .edit-title  { font-size: .9rem; margin-bottom: .35rem; }
    .edit-body   { font-size: .875rem; resize: vertical; }
    .edit-actions { display: flex; gap: .5rem; margin-top: .4rem; }

    .empty { font-size: .875rem; color: var(--text-muted); padding: 1.5rem 0; text-align: center; }
  </style>
</head>
<body>

  <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
      <filter id="ink-edge" x="-25%" y="-25%" width="150%" height="150%">
        <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="5" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="/home/">paperbackd<span class="title-dot">.</span></a>
      <nav class="desktop-nav">

        <a href="../search/"   data-nav="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>search</a>
        <a href="../network/"  data-nav="network"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><line x1="8.7" y1="10.7" x2="15.3" y2="7.3"/><line x1="8.7" y1="13.3" x2="15.3" y2="16.7"/></svg>network</a>
        <a href="../library/"  data-nav="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>library</a>
        <a href="../lists/"    data-nav="lists"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4" cy="18" r="1" fill="currentColor" stroke="none"/></svg>lists</a>
        <a href="../stats/"    data-nav="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="13" width="4" height="7" rx="0.5"/><rect x="10" y="3" width="4" height="17" rx="0.5"/><rect x="17" y="9" width="4" height="11" rx="0.5"/></svg>stats</a>
        <a href="../profile/"  data-nav="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>profile</a>
        <a href="../settings/" data-nav="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>settings</a>
      </nav>
    </div>
  </header>

  <main class="page-content">
    <h1 class="page-title">announcements<span class="title-dot">.</span></h1>
    <div id="announcements-list"></div>
  </main>

  <script src="../js/main.js"></script>
  <script>document.body.classList.add('auth-loading');</script>
  <script type="module">
    import { requireAuth } from '../js/auth.js';
    import { getAnnouncements, addAnnouncement, updateAnnouncement, deleteAnnouncement, getProfile, getFollowing, toggleAnnouncementReaction } from '../js/firebase.js';

    function esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    const REACTIONS = [
      { key: 'heart',        svg: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.593C6.37 16.054 1 11.296 1 7.191 1 3.4 4.068 2 6.281 2c1.312 0 4.151.501 5.719 4.457C13.59 2.489 16.464 2 17.726 2 20.266 2 23 3.621 23 7.181c0 4.069-5.136 8.625-11 14.412z"/></svg>` },
      { key: 'broken_heart', svg: `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.593C6.37 16.054 1 11.296 1 7.191 1 3.4 4.068 2 6.281 2c1.312 0 4.151.501 5.719 4.457C13.59 2.489 16.464 2 17.726 2 20.266 2 23 3.621 23 7.181c0 4.069-5.136 8.625-11 14.412z"/><polyline points="12,6 10,10 13.5,12.5 10,17"/></svg>` },
      { key: 'shocked',      svg: `<svg viewBox="0 0 36 36" width="15" height="15" fill="none" stroke="currentColor" stroke-width="3.5"><circle cx="18" cy="18" r="15.5"/><ellipse cx="12" cy="13.5" rx="2.5" ry="3.5" fill="currentColor" stroke="none"/><ellipse cx="24" cy="13.5" rx="2.5" ry="3.5" fill="currentColor" stroke="none"/><ellipse cx="18" cy="25" rx="4" ry="5" fill="currentColor" stroke="none"/></svg>` },
      { key: 'laugh_cry',    svg: `<svg viewBox="0 0 512 512" width="15" height="15" fill="currentColor" overflow="visible" xmlns="http://www.w3.org/2000/svg"><path d="M256,0C114.618,0,0,114.618,0,256s114.618,256,256,256s256-114.618,256-256S397.382,0,256,0z M256,469.333c-117.818,0-213.333-95.515-213.333-213.333S138.182,42.667,256,42.667S469.333,138.182,469.333,256S373.818,469.333,256,469.333z"/><path d="M384,298.667H128c-11.782,0-21.333,9.551-21.333,21.333c0,77.189,65.715,128,149.333,128s149.333-50.811,149.333-128C405.333,308.218,395.782,298.667,384,298.667z M256,405.333c-52.965,0-93.164-25.064-103.851-64h207.701C349.164,380.269,308.965,405.333,256,405.333z"/><path d="M134.248,249.752c8.331,8.331,21.839,8.331,30.17,0l42.667-42.667c8.331-8.331,8.331-21.839,0-30.17l-42.667-42.667c-8.331-8.331-21.839-8.331-30.17,0s-8.331,21.839,0,30.17L161.83,192l-27.582,27.582C125.917,227.913,125.917,241.42,134.248,249.752z"/><path d="M347.582,249.752c8.331,8.331,21.839,8.331,30.17,0c8.331-8.331,8.331-21.839,0-30.17L350.17,192l27.582-27.582c8.331-8.331,8.331-21.839,0-30.17c-8.331-8.331-21.839-8.331-30.17,0l-42.667,42.667c-8.331,8.331-8.331,21.839,0,30.17L347.582,249.752z"/><path d="M 0,0 C 14,48 44,74 44,118 A 44,44 0 0,1 -44,118 C -44,74 -14,48 0,0 Z" transform="translate(85,200) rotate(45)"/><path d="M 0,0 C 14,48 44,74 44,118 A 44,44 0 0,1 -44,118 C -44,74 -14,48 0,0 Z" transform="translate(427,200) rotate(-45)"/></svg>` },
    ];

    const { user, profile: cachedProfile } = await requireAuth();
    document.body.classList.remove('auth-loading');
    const myProfile = (await getProfile(user.uid).catch(() => null)) || cachedProfile;
    const isAdmin = !!myProfile.isAdmin;

    const following = await getFollowing(user.uid).catch(() => []);
    const avatarMap   = { [user.uid]: myProfile.avatarUrl || null };
    const usernameMap = { [user.uid]: myProfile.username  || ''   };
    following.forEach(f => {
      avatarMap[f.uid]   = f.avatarUrl || null;
      usernameMap[f.uid] = f.username  || '';
    });

    let openPickerClose = null;
    document.addEventListener('click', () => { if (openPickerClose) { openPickerClose(); openPickerClose = null; } });

    function buildAnnouncementReactionsBar(item) {
      const state = {};
      REACTIONS.forEach(({ key }) => { state[key] = [...((item.reactions || {})[key] || [])]; });

      const bar = document.createElement('div');
      bar.style.cssText = 'position:absolute;bottom:.5rem;right:.65rem;display:flex;align-items:center;gap:0';

      const wrap = document.createElement('span');
      wrap.style.cssText = 'position:relative;display:inline-flex;align-items:center;height:1.5rem;overflow:visible';

      const totalBadge = document.createElement('span');
      totalBadge.style.cssText = 'font-size:.65rem;font-weight:600;color:var(--text-muted);opacity:.55;font-variant-numeric:tabular-nums;display:none;line-height:1;margin-right:.2rem';

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.style.cssText = 'position:relative;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:50%;border:none;background:transparent;cursor:pointer;color:var(--text-muted);opacity:.55;padding:0;flex-shrink:0';
      addBtn.innerHTML = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>';

      const picker = document.createElement('div');
      picker.style.cssText = 'display:none;position:absolute;background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:.3rem .5rem;gap:.3rem;box-shadow:0 4px 16px rgba(0,0,0,.15);z-index:1000;white-space:nowrap';

      // Places the picker under an anchor, in document coordinates so it stays
      // attached while the page scrolls. position:fixed pinned it to the viewport,
      // so the page scrolled out from under it. Right edges are aligned by
      // computing a left offset, which needs the rendered width — hence showing
      // it hidden for a moment rather than positioning blind.
      function placePicker(anchor) {
        picker.style.right = '';
        picker.style.visibility = 'hidden';
        picker.style.display = 'flex';
        document.body.appendChild(picker);
        const rect = anchor.getBoundingClientRect();
        picker.style.top  = `${rect.bottom + window.scrollY + 6}px`;
        picker.style.left = `${rect.right + window.scrollX - picker.offsetWidth}px`;
        picker.style.visibility = '';
      }

      let pickerOpen = false;
      const closePicker = () => {
        pickerOpen = false;
        picker.style.display = 'none';
        if (picker.parentNode === document.body) document.body.removeChild(picker);
      };

      function updateTotal() {
        const total = Object.values(state).reduce((sum, arr) => sum + arr.length, 0);
        totalBadge.textContent = total || '';
        totalBadge.style.display = total > 0 ? 'inline' : 'none';
      }

      function renderInline() {
        wrap.innerHTML = '';
        const active = REACTIONS.filter(({ key }) => state[key].length > 0);
        if (active.length > 0) {
          active.forEach(({ key, svg }, i) => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.style.cssText = `position:relative;width:19px;height:19px;border-radius:50%;background:var(--bg-card);display:inline-flex;align-items:center;justify-content:center;border:none;cursor:pointer;padding:0;color:var(--accent);flex-shrink:0;z-index:${active.length - i};${i > 0 ? 'margin-left:-6px;' : ''}`;
            btn.innerHTML = svg;
            btn.addEventListener('click', e => {
              e.stopPropagation();
              if (openPickerClose && openPickerClose !== closePicker) openPickerClose();
              pickerOpen = !pickerOpen;
              if (pickerOpen) {
                renderPicker();
                placePicker(wrap);
                openPickerClose = closePicker;
              } else { closePicker(); }
            });
            wrap.appendChild(btn);
          });
        } else {
          wrap.appendChild(addBtn);
        }
      }

      function renderPicker() {
        picker.innerHTML = '';
        picker.style.flexDirection = 'column';
        picker.style.alignItems = 'stretch';

        const emojiRow = document.createElement('div');
        emojiRow.style.cssText = 'display:flex;gap:.3rem';

        REACTIONS.forEach(({ key, svg }) => {
          const users = state[key];
          const mine = users.includes(user.uid);
          const eb = document.createElement('button');
          eb.type = 'button';
          eb.style.cssText = `position:relative;background:${mine ? 'var(--bg-alt)' : 'none'};border:none;cursor:pointer;padding:.3rem .35rem .45rem;border-radius:6px;line-height:1;display:inline-flex;align-items:center;justify-content:center;color:var(--accent)`;
          eb.innerHTML = svg;
          if (users.length) {
            const badge = document.createElement('span');
            badge.style.cssText = 'position:absolute;bottom:3px;right:3px;font-size:.48rem;font-weight:700;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums';
            badge.textContent = users.length;
            eb.appendChild(badge);
          }
          eb.addEventListener('click', async e => {
            e.stopPropagation();
            const prevKey = REACTIONS.find(r => state[r.key].includes(user.uid))?.key;
            const toggling = prevKey === key;
            const promises = [];
            if (prevKey && !toggling) {
              state[prevKey] = state[prevKey].filter(u => u !== user.uid);
              promises.push(toggleAnnouncementReaction(item.id, prevKey, user.uid, false));
            }
            if (toggling) {
              state[key] = state[key].filter(u => u !== user.uid);
              promises.push(toggleAnnouncementReaction(item.id, key, user.uid, false));
            } else {
              state[key] = [...state[key], user.uid];
              promises.push(toggleAnnouncementReaction(item.id, key, user.uid, true));
            }
            renderInline();
            updateTotal();
            renderPicker();
            Promise.all(promises).catch(console.error);
          });
          emojiRow.appendChild(eb);
        });
        picker.appendChild(emojiRow);

        const total = Object.values(state).reduce((sum, arr) => sum + arr.length, 0);
        if (total > 0) {
          const whoList = document.createElement('div');
          whoList.style.cssText = 'display:flex;flex-direction:column;gap:.25rem;padding-top:.3rem;margin-top:.3rem;border-top:1px solid var(--border)';
          REACTIONS.forEach(({ key, svg }) => {
            state[key].forEach(uid => {
              const uname = usernameMap[uid] || uid;
              const avatarUrl = avatarMap[uid];
              const initial = (uname?.[0] || '?').toUpperCase();
              const row = document.createElement('div');
              row.style.cssText = 'display:flex;align-items:center;gap:.35rem;font-size:.7rem;color:var(--text)';
              const av = document.createElement('a');
              av.href = `../profile/?u=${esc(uname)}`;
              av.className = 'friend-avatar';
              av.style.cssText = 'width:16px;height:16px;font-size:.45rem;flex-shrink:0;text-decoration:none;color:inherit';
              av.innerHTML = avatarUrl ? `<img src="${esc(avatarUrl)}" alt="" loading="lazy">` : esc(initial);
              const name = document.createElement('a');
              name.href = `../profile/?u=${esc(uname)}`;
              name.style.cssText = 'color:inherit;text-decoration:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
              name.textContent = uname;
              const icon = document.createElement('span');
              icon.innerHTML = svg;
              icon.style.cssText = 'color:var(--accent);display:flex;align-items:center;flex-shrink:0';
              row.append(av, name, icon);
              whoList.appendChild(row);
            });
          });
          picker.appendChild(whoList);
        }
      }

      addBtn.addEventListener('click', e => {
        e.stopPropagation();
        if (openPickerClose && openPickerClose !== closePicker) openPickerClose();
        pickerOpen = !pickerOpen;
        if (pickerOpen) {
          renderPicker();
          placePicker(addBtn);
          openPickerClose = closePicker;
        } else { closePicker(); openPickerClose = null; }
      });
      picker.addEventListener('click', e => e.stopPropagation());
      wrap.append(addBtn);
      bar.append(totalBadge, wrap);
      renderPicker();
      renderInline();
      updateTotal();
      return bar;
    }

    const listEl = document.getElementById('announcements-list');

    function formatDate(ts) {
      const d = ts?.toDate?.() ?? null;
      return d ? d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    }

    function renderAnnouncement(item) {
      const card = document.createElement('div');
      card.className = 'announcement-card';

      const reactionsBar = buildAnnouncementReactionsBar(item);

      function showView() {
        card.innerHTML = '';
        const dateStr = formatDate(item.createdAt);
        if (dateStr) {
          const d = document.createElement('div');
          d.className = 'announcement-date';
          d.textContent = dateStr;
          card.appendChild(d);
        }
        const titleEl = document.createElement('div');
        titleEl.className = 'announcement-title';
        titleEl.textContent = item.title || '';
        card.appendChild(titleEl);
        const bodyEl = document.createElement('div');
        bodyEl.className = 'announcement-body';
        bodyEl.textContent = item.body || '';
        card.appendChild(bodyEl);

        if (isAdmin) {
          const actions = document.createElement('div');
          actions.className = 'announcement-actions';
          const editBtn = document.createElement('button');
          editBtn.className = 'announcement-btn announcement-btn-edit';
          editBtn.textContent = 'edit';
          editBtn.addEventListener('click', showEdit);
          const delBtn = document.createElement('button');
          delBtn.className = 'announcement-btn announcement-btn-delete';
          delBtn.textContent = 'delete';
          delBtn.addEventListener('click', async () => {
            if (!confirm('Delete this announcement?')) return;
            await deleteAnnouncement(item.id);
            card.remove();
          });
          actions.append(editBtn, delBtn);
          card.appendChild(actions);
        }

        card.appendChild(reactionsBar);
      }

      function showEdit() {
        card.innerHTML = '';
        const titleInput = document.createElement('input');
        titleInput.className = 'edit-input edit-title';
        titleInput.type = 'text';
        titleInput.value = item.title || '';
        titleInput.placeholder = 'Title';
        const bodyInput = document.createElement('textarea');
        bodyInput.className = 'edit-input edit-body';
        bodyInput.value = item.body || '';
        bodyInput.placeholder = 'Body';
        bodyInput.rows = 5;
        const actions = document.createElement('div');
        actions.className = 'edit-actions';
        const saveBtn = document.createElement('button');
        saveBtn.className = 'announcement-btn announcement-btn-edit';
        saveBtn.textContent = 'save';
        saveBtn.addEventListener('click', async () => {
          const newTitle = titleInput.value.trim();
          const newBody  = bodyInput.value.trim();
          if (!newTitle) return;
          await updateAnnouncement(item.id, { title: newTitle, body: newBody });
          item.title = newTitle;
          item.body  = newBody;
          showView();
        });
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'announcement-btn announcement-btn-delete';
        cancelBtn.textContent = 'cancel';
        cancelBtn.addEventListener('click', showView);
        actions.append(saveBtn, cancelBtn);
        card.append(titleInput, bodyInput, actions);
        titleInput.focus();
      }

      showView();
      return card;
    }

    function showNewForm() {
      const card = document.createElement('div');
      card.className = 'announcement-card';
      const titleInput = document.createElement('input');
      titleInput.className = 'edit-input edit-title';
      titleInput.type = 'text';
      titleInput.placeholder = 'Title';
      const bodyInput = document.createElement('textarea');
      bodyInput.className = 'edit-input edit-body';
      bodyInput.placeholder = 'Body';
      bodyInput.rows = 5;
      const actions = document.createElement('div');
      actions.className = 'edit-actions';
      const postBtn = document.createElement('button');
      postBtn.className = 'announcement-btn announcement-btn-edit';
      postBtn.textContent = 'post';
      postBtn.addEventListener('click', async () => {
        const title = titleInput.value.trim();
        const body  = bodyInput.value.trim();
        if (!title) return;
        const ref = await addAnnouncement({ title, body });
        const newItem = { id: ref.id, title, body, createdAt: null };
        card.replaceWith(renderAnnouncement(newItem));
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'announcement-btn announcement-btn-delete';
      cancelBtn.textContent = 'cancel';
      cancelBtn.addEventListener('click', () => card.remove());
      actions.append(postBtn, cancelBtn);
      card.append(titleInput, bodyInput, actions);
      listEl.prepend(card);
      titleInput.focus();
    }

    const items = await getAnnouncements(100).catch(() => []);

    if (isAdmin) {
      const addBtn = document.createElement('button');
      addBtn.className = 'admin-add-btn';
      addBtn.textContent = '+ new announcement';
      addBtn.addEventListener('click', showNewForm);
      listEl.appendChild(addBtn);
    }

    if (!items.length && !isAdmin) {
      listEl.innerHTML = '<p class="empty">No announcements yet.</p>';
    } else {
      items.forEach(item => listEl.appendChild(renderAnnouncement(item)));
    }
  </script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
