  <script src="../js/main.js"></script>
  <script>document.body.classList.add('auth-loading');</script>
  <script type="module">
    import { requireAuth } from '../js/auth.js';
    import { searchUsers, getFollowerCount } from '../js/firebase.js';
    import { orderByFollowers } from '../js/utils.js';
    import { searchBooks } from '../js/hardcover.js';

    const { user } = await requireAuth();
    document.body.classList.remove('auth-loading');

    const HARDCOVER_PROXY = 'https://frosty-paper-e53b.phixel66.workers.dev/';
    const input      = document.getElementById('search-input');
    const results    = document.getElementById('search-results');
    const tabAll     = document.getElementById('tab-all');
    const tabBooks   = document.getElementById('tab-books');
    const tabAuthors = document.getElementById('tab-authors');
    const tabUsers   = document.getElementById('tab-users');
    let timer;
    let activeTab = 'all';

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    const RECENTS_KEY = 'rl_recents';
    const RECENTS_MAX = 8;

    function getRecents() {
      try { return JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]'); } catch { return []; }
    }
    function saveRecent(item) {
      const list = getRecents().filter(r => r.href !== item.href);
      list.unshift(item);
      localStorage.setItem(RECENTS_KEY, JSON.stringify(list.slice(0, RECENTS_MAX)));
    }
    const followerLabel = n => `${n} ${n === 1 ? 'follower' : 'followers'}`;

    // Fills a row's meta line with the follower count after the row is already on
    // screen. Used by the recents list, which has no order to establish and so
    // should not wait on a count query per person. Silent on failure: the row
    // still works, and its min-height fixes its size either way.
    function fillFollowerCount(row, uid) {
      const metaEl = row.querySelector('.search-result-meta');
      if (!metaEl || !uid) return;
      getFollowerCount(uid)
        .then(n => { metaEl.textContent = followerLabel(n); })
        .catch(() => {});
    }

    // Search results, on the other hand, are ordered by follower count, so the
    // counts have to be in hand before anything is drawn. One count query per
    // person, but they go out together — about one round trip, not one each.
    //
    // A count that fails counts as zero rather than sinking the whole search.
    async function withFollowerCounts(users) {
      const counts = await Promise.all(
        users.map(u => getFollowerCount(u.uid).catch(() => 0))
      );
      return orderByFollowers(users.map((u, i) => ({ ...u, followerCount: counts[i] })));
    }

    // Tab ids are plural, the type stored on a recent is singular.
    const RECENT_TYPE_FOR_TAB = { users: 'user', books: 'book', authors: 'author' };

    function renderRecents() {
      results.innerHTML = '';
      // 'all' has no entry, so nothing is filtered out there.
      const wanted = RECENT_TYPE_FOR_TAB[activeTab];
      const list = getRecents().filter(r => !wanted || r.type === wanted);
      if (!list.length) return;
      const hdr = document.createElement('div');
      hdr.style.cssText = 'font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:.35rem';
      hdr.textContent = 'Recently viewed';
      results.appendChild(hdr);
      list.forEach(item => {
        const a = document.createElement('a');
        a.href = item.href;
        a.className = 'search-result-row';
        a.style.textDecoration = 'none';
        let coverHtml;
        if (item.type === 'user') {
          const bs = item.borderColor ? `border-color:${esc(item.borderColor)}` : '';
          const inner = item.coverUrl
            ? `<img src="${esc(item.coverUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
            : esc(item.initial);
          coverHtml = `<div class="friend-avatar" style="flex-shrink:0;${bs}">${inner}</div>`;
        } else if (item.isRound) {
          coverHtml = item.coverUrl
            ? `<span class="hex-avatar"><img class="hex-avatar-img" src="${esc(item.coverUrl)}" alt=""></span>`
            : `<span class="hex-avatar"><span class="hex-avatar-img hex-avatar-placeholder">${esc(item.initial)}</span></span>`;
        } else {
          coverHtml = item.coverUrl
            ? `<img class="search-result-cover" src="${esc(item.coverUrl)}" alt="">`
            : `<div class="search-result-cover search-result-cover-placeholder"></div>`;
        }
        // Users get the same row as in results: display name beside the
        // username, follower count beneath. Recents saved before those fields
        // were stored simply have neither, and fall back to the plain row.
        const isUser    = item.type === 'user';
        const showName  = isUser && item.displayName
                          && item.displayName.toLowerCase() !== String(item.label).toLowerCase();
        const nameHtml  = showName ? ` <span class="network-row-handle">${esc(item.displayName)}</span>` : '';
        const metaHtml  = isUser
          ? (item.uid ? '<div class="search-result-meta"></div>' : '')
          : (item.sublabel ? `<div class="search-result-meta">${esc(item.sublabel)}</div>` : '');
        a.innerHTML = `${coverHtml}<div class="search-result-info">
          <div class="search-result-title" style="font-size:.9rem">${esc(item.label)}${nameHtml}</div>
          ${metaHtml}
        </div>`;
        if (isUser) fillFollowerCount(a, item.uid);
        const xBtn = document.createElement('button');
        xBtn.type = 'button';
        xBtn.innerHTML = '&times;';
        xBtn.setAttribute('aria-label', 'Remove from recently viewed');
        xBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:1.1rem;line-height:1;padding:.2rem .3rem;flex-shrink:0;opacity:.5;transition:opacity .15s;margin-left:auto';
        xBtn.addEventListener('mouseenter', () => xBtn.style.opacity = '1');
        xBtn.addEventListener('mouseleave', () => xBtn.style.opacity = '.5');
        xBtn.addEventListener('click', e => {
          e.preventDefault();
          e.stopPropagation();
          localStorage.setItem(RECENTS_KEY, JSON.stringify(getRecents().filter(r => r.href !== item.href)));
          renderRecents();
        });
        a.appendChild(xBtn);
        results.appendChild(a);
      });
    }

    const tabDefs = [
      { id: 'all',     btn: tabAll,     placeholder: 'Search everything…' },
      { id: 'users',   btn: tabUsers,   placeholder: 'Search for a user…' },
      { id: 'books',   btn: tabBooks,   placeholder: 'Search for a book…' },
      { id: 'authors', btn: tabAuthors, placeholder: 'Search for an author…' },
    ];

    function setTab(tab) {
      activeTab = tab;
      tabDefs.forEach(t => {
        const active = t.id === tab;
        t.btn.classList.toggle('active', active);
        if (active) input.placeholder = t.placeholder;
      });
      const q = input.value.trim();
      if (q) runSearch(q); else renderRecents();
    }

    tabAll.addEventListener('click',     () => setTab('all'));
    tabBooks.addEventListener('click',   () => setTab('books'));
    tabAuthors.addEventListener('click', () => setTab('authors'));
    tabUsers.addEventListener('click',   () => setTab('users'));

    // Pre-fill from ?q= / ?tab= URL params (e.g. navigating here from book/author pages)
    const _sp = new URLSearchParams(location.search);
    const _preTab = _sp.get('tab');
    const _preQ   = _sp.get('q');
    if (_preTab && tabDefs.find(t => t.id === _preTab)) setTab(_preTab);
    if (_preQ) { input.value = _preQ; runSearch(_preQ); }
    else renderRecents();

    const searchClearBtn = document.createElement('button');
    searchClearBtn.type = 'button';
    searchClearBtn.setAttribute('aria-label', 'Clear search');
    searchClearBtn.style.cssText = 'display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);font-size:1.1rem;line-height:1;padding:2px 5px;cursor:pointer';
    searchClearBtn.innerHTML = '&times;';
    document.getElementById('search-wrap').appendChild(searchClearBtn);

    function updateSearchClear() {
      searchClearBtn.style.display = input.value ? '' : 'none';
      input.style.paddingRight = input.value ? '28px' : '';
    }

    input.addEventListener('input', () => {
      clearTimeout(timer);
      updateSearchClear();
      const q = input.value.trim();
      if (!q) { renderRecents(); return; }
      timer = setTimeout(() => runSearch(q), 280);
    });

    searchClearBtn.addEventListener('click', () => {
      input.value = '';
      input.dispatchEvent(new Event('input'));
      input.focus();
    });

    if (input.value) updateSearchClear();

    function runSearch(q) {
      if (activeTab === 'all')           fetchAll(q);
      else if (activeTab === 'books')    fetchBooks(q);
      else if (activeTab === 'authors')  fetchAuthors(q);
      else                               fetchUsers(q);
    }

    function sectionHeader(label) {
      const el = document.createElement('div');
      el.style.cssText = 'font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:.5rem .75rem .2rem';
      el.textContent = label;
      return el;
    }

    async function fetchAll(q) {
      results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Searching…</p>';
      const [br, ar, ur] = await Promise.allSettled([
        searchBooks(q, 8),
        (async () => {
          const res = await fetch(HARDCOVER_PROXY, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ query:`query($q:String!){search(query:$q,query_type:"Author",per_page:8){results}}`, variables:{q} }) });
          return ((await res.json())?.data?.search?.results?.hits || []).map(h => h.document);
        })(),
        (async () => withFollowerCounts(await searchUsers(q, user.uid)))(),
      ]);
      const books   = br.status === 'fulfilled' ? br.value : [];
      const authors = ar.status === 'fulfilled' ? ar.value : [];
      const users   = ur.status === 'fulfilled' ? ur.value : [];
      if (!books.length && !authors.length && !users.length) {
        results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">No results found.</p>';
        return;
      }
      results.innerHTML = '';
      if (users.length)   { results.appendChild(sectionHeader('Users'));   renderUsers(users, { append: true }); }
      if (books.length)   { results.appendChild(sectionHeader('Books'));   renderBooks(books, { append: true }); }
      if (authors.length) { results.appendChild(sectionHeader('Authors')); renderAuthors(authors, { append: true }); }
    }

    function showToast(msg) {
      let t = document.getElementById('global-toast');
      if (!t) { t = document.createElement('div'); t.id = 'global-toast'; t.className = 'global-toast'; document.body.appendChild(t); }
      t.textContent = msg;
      t.classList.add('visible');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('visible'), 5000);
    }

    async function fetchBooks(q) {
      results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Searching…</p>';
      try {
        renderBooks(await searchBooks(q, 20));
      } catch (e) {
        // searchBooks already backs off and retries a 429 before giving up.
        if (String(e?.message || '').includes('429')) {
          results.innerHTML = '';
          showToast('Our servers are busy — give it a moment and try again.');
          return;
        }
        results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Search failed. Please try again.</p>';
      }
    }

    async function fetchAuthors(q) {
      results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Searching…</p>';
      try {
        const res = await fetch(HARDCOVER_PROXY, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            query: `query($q:String!){search(query:$q,query_type:"Author",per_page:20){results}}`,
            variables: { q }
          })
        });
        if (res.status === 429) { results.innerHTML = ''; showToast('Our servers are busy — give it a moment and try again.'); return; }
        const data = await res.json();
        const hits = data?.data?.search?.results?.hits || [];
        renderAuthors(hits.map(h => h.document));
      } catch (e) {
        results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Search failed. Please try again.</p>';
      }
    }

    function renderAuthors(docs, { append = false } = {}) {
      if (!docs.length) {
        if (!append) results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">No results found.</p>';
        return;
      }
      if (!append) results.innerHTML = '';
      docs.forEach(doc => {
        const slug       = doc.slug || String(doc.id);
        const name       = doc.name || '';
        const image      = doc.image?.url || '';
        const booksCount = doc.books_count ?? doc.default_books_count ?? null;
        const a = document.createElement('a');
        a.href = `../author/?slug=${encodeURIComponent(slug)}`;
        a.className = 'search-result-row';
        a.innerHTML = image
          ? `<span class="hex-avatar"><img class="hex-avatar-img" src="${esc(image)}" alt=""></span>`
          : `<span class="hex-avatar"><span class="hex-avatar-img hex-avatar-placeholder">${esc((name[0] || '?').toUpperCase())}</span></span>`;
        a.innerHTML += `<div class="search-result-info"><div class="search-result-title">${esc(name)}</div>${booksCount != null ? `<div class="search-result-meta">${booksCount} book${booksCount === 1 ? '' : 's'}</div>` : ''}</div>`;
        a.addEventListener('click', () => saveRecent({
          type: 'author', label: name, sublabel: booksCount != null ? `${booksCount} book${booksCount === 1 ? '' : 's'}` : '', coverUrl: image,
          href: a.href, initial: (name[0] || '?').toUpperCase(), isRound: true, borderColor: '',
        }));
        results.appendChild(a);
      });
    }

    async function fetchUsers(q) {
      results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Searching…</p>';
      try {
        renderUsers(await withFollowerCounts(await searchUsers(q, user.uid)));
      } catch (e) {
        results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">Search failed. Please try again.</p>';
      }
    }

    function renderBooks(docs, { append = false } = {}) {
      if (!docs.length) {
        if (!append) results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">No results found.</p>';
        return;
      }
      if (!append) results.innerHTML = '';
      docs.forEach(doc => {
        const slug   = doc.slug || String(doc.id);
        const title  = doc.title || '';
        const author = Array.isArray(doc.author_names) ? doc.author_names[0] : (doc.author_names || '');
        const cover  = doc.image?.url || '';
        const year   = doc.release_year || '';

        const a = document.createElement('a');
        a.href = `../book/?gbid=${encodeURIComponent(slug)}`;
        a.className = 'search-result-row';
        a.innerHTML = cover
          ? `<img class="search-result-cover" src="${esc(cover)}" alt="">`
          : `<div class="search-result-cover search-result-cover-placeholder"></div>`;
        a.innerHTML += `<div class="search-result-info">
          <div class="search-result-title">${esc(title)}</div>
          <div class="search-result-meta">${author ? esc(author) : ''}${author && year ? ' · ' : ''}${year ? esc(String(year)) : ''}</div>
        </div>`;
        a.addEventListener('click', () => saveRecent({
          type: 'book', label: title,
          sublabel: [author, year ? String(year) : ''].filter(Boolean).join(' · '),
          coverUrl: cover, href: a.href, initial: (title[0] || '?').toUpperCase(),
          isRound: false, borderColor: '',
        }));
        results.appendChild(a);
      });
    }

    function renderUsers(users, { append = false } = {}) {
      if (!users.length) {
        if (!append) results.innerHTML = '<p style="color:var(--text-muted);font-size:.85rem">No users found.</p>';
        return;
      }
      if (!append) results.innerHTML = '';
      users.forEach(u => {
        const a = document.createElement('a');
        a.href = `../profile/?u=${encodeURIComponent(u.username)}`;
        a.className = 'search-result-row';
        a.style.textDecoration = 'none';
        const initial = (u.username?.[0] || '?').toUpperCase();
        const borderStyle = u.avatarBorderColor ? `border-color:${esc(u.avatarBorderColor)}` : '';
        const avatarInner = u.avatarUrl
          ? `<img src="${esc(u.avatarUrl)}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`
          : esc(initial);
        const showName = u.displayName && u.displayName.toLowerCase() !== u.username.toLowerCase();
        a.innerHTML = `<div class="friend-avatar" style="flex-shrink:0;${borderStyle}">${avatarInner}</div>
          <div class="search-result-info">
            <div class="search-result-title" style="font-size:.9rem">${esc(u.username)}${showName ? ` <span class="network-row-handle">${esc(u.displayName)}</span>` : ''}</div>
            <div class="search-result-meta">${typeof u.followerCount === 'number' ? esc(followerLabel(u.followerCount)) : ''}</div>
          </div>`;
        a.addEventListener('click', () => saveRecent({
          type: 'user', label: u.username, sublabel: '', coverUrl: u.avatarUrl || '',
          href: a.href, initial, isRound: true, borderColor: u.avatarBorderColor || '',
          // Kept so the recents list can render the same row: the uid to count
          // followers with, and the display name to show beside the username.
          uid: u.uid, displayName: u.displayName || '',
        }));
        results.appendChild(a);
        // Only if the count did not arrive with the user — every search path
        // supplies it now, but a caller that does not should still show one.
        if (typeof u.followerCount !== 'number') fillFollowerCount(a, u.uid);
      });
    }

    renderRecents();
    input.focus();
  </script>
  <script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');</script>
</body>
</html>
